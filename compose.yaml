services:
  app:
    build:
      context: .
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-0.14.0}
        GIT_SHA: ${GIT_SHA:-development}
    container_name: mynotes
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "2026:2026"
    environment:
      PORT: "2026"
      DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:2026}
      APP_ORIGINS: ${APP_ORIGINS:-${APP_ORIGIN:-http://localhost:2026}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SIGNUP_ROLE: ${SIGNUP_ROLE:-guest}
      TOTP_POLICY: ${TOTP_POLICY:-optional}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      MAX_MARKDOWN_BYTES: ${MAX_MARKDOWN_BYTES:-2000000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      USER_STORAGE_QUOTA_BYTES: ${USER_STORAGE_QUOTA_BYTES:-10737418240}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-1073741824}
      PUSH_ENABLED: ${PUSH_ENABLED:-auto}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-}
      PUSH_ENDPOINT_HOSTS: ${PUSH_ENDPOINT_HOSTS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_INSTANCE_NAME: ${MAIL_INSTANCE_NAME:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-500}
      MAIL_ALLOW_HTTP_LINKS: ${MAIL_ALLOW_HTTP_LINKS:-false}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    volumes:
      - ${MYNOTES_DATA_DIR:-/srv/mynotes}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2026/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 8s
