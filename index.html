    <meta property="og:image" content="https://raw.githubusercontent.com/pankajsoni19/nook/main/public/social-preview.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nook — Private self-hosted workspace</title>
    <!--
      If the app's script never runs (a failed download, a blocked script), the page would stay empty.
      This note appears after 8 s by CSS alone (the CSP allows no inline script); main.tsx removes it as
      soon as the app has mounted, so a normal load never shows it.
    -->
    <style>
      .boot-fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #09090b; color: #e4e4e7; font: 15px/1.5 system-ui, sans-serif; text-align: center; opacity: 0; pointer-events: none; animation: boot-fallback-show 0s linear 8s forwards; }
      .boot-fallback a { color: #f6c453; }
      .boot-fallback.now { animation: none; opacity: 1; pointer-events: auto; }
      @keyframes boot-fallback-show { to { opacity: 1; pointer-events: auto; } }
    </style>
  </head>
  <body>
    <div id="boot-fallback" class="boot-fallback" role="status"><p>Nook did not finish loading. Check your connection, then <a href="">reload the page</a>.</p></div>
    <noscript><div class="boot-fallback now"><p>Nook needs JavaScript. Turn it on for this site, then <a href="">reload the page</a>.</p></div></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
